[package]
name = "mdk_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
mdk-core = { version = "0.7.1", features = ["mip04"] }
mdk-sqlite-storage = "0.7.1"
mdk-storage-traits = "0.7.1"
libsqlite3-sys = { version = "0.35.0", features = ["bundled-sqlcipher-vendored-openssl"] }
once_cell = "1.21.3"
hex = "0.4.3"
nostr = "0.44.2"
serde_json = "1.0"
