[package]
name = "mdk_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
mdk-core = { version = "0.7.1", git = "https://github.com/marmot-protocol/mdk", rev = "8a8d06c19d617394b0e268f5f9adfad34db3cdf6", features = ["mip04"] }
mdk-sqlite-storage = { version = "0.7.1", git = "https://github.com/marmot-protocol/mdk", rev = "8a8d06c19d617394b0e268f5f9adfad34db3cdf6", features = ["test-utils"] }
mdk-storage-traits = { version = "0.7.1", git = "https://github.com/marmot-protocol/mdk", rev = "8a8d06c19d617394b0e268f5f9adfad34db3cdf6" }
libsqlite3-sys = { version = "0.35.0", features = ["bundled-sqlcipher-vendored-openssl"] }
once_cell = "1.21.3"
hex = "0.4.3"
nostr = "0.44.2"
serde_json = "1.0"

[dev-dependencies]
mdk-core-legacy = { package = "mdk-core", version = "0.7.1", git = "https://github.com/marmot-protocol/mdk", rev = "ca0663ee332958aa92efadf916d19c6e1b1f99c7", features = ["mip04"] }
mdk-memory-storage-legacy = { package = "mdk-memory-storage", version = "0.7.1", git = "https://github.com/marmot-protocol/mdk", rev = "ca0663ee332958aa92efadf916d19c6e1b1f99c7" }
openmls = { version = "0.8.1", default-features = false }
tempfile = "3.23.0"
tokio = { version = "1.44", features = ["macros", "rt", "rt-multi-thread", "sync"] }
